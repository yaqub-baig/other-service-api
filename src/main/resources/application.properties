spring.application.name=other-service-api
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/auto_adda_other_service?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.profiles.active=local
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.tryItOutEnabled=true
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

file.upload-dir=../uploaded-files
file.base-url=http://192.168.1.14:8080/garage-service/api/v1

# Multipart Configuration
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=2KB

# Tomcat Configuration
server.tomcat.max-http-form-post-size=200MB
server.tomcat.max-swallow-size=200MB
server.tomcat.connection-timeout=60000

# HTTP Configuration
server.max-http-request-header-size=64KB

garage.service.base.url=http://localhost:9010/api/v1
garage.service.base.prod.url=https://otherservice.mylstech.xyz/api/v1
server.port=9010
server.servlet.contextPath=/api/v1

# Downstream services (Feign)
clients.identity-api.url=${IDENTITY_API_URL:http://localhost:8010/api/v1}
clients.vehicle-api.url=${VEHICLE_API_URL:http://localhost:8030/api/v1}

# HikariCP pool settings
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=20

# Starter catalog (seed/catalog-seed.json) and the countries it is enabled in
catalog.seed.enabled=true
catalog.seed.markets=AE
catalog.default-country=AE
